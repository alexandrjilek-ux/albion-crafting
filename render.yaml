services:
  - type: web
    name: albion-crafting-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ALBION_CORS_ORIGINS
        value: "*"
  - type: web
    name: albion-crafting-web
    runtime: static
    buildCommand: cd mobile && npm install && npm run web:export
    staticPublishPath: mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://albion-crafting-api.onrender.com
